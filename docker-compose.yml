version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aeris-postgres
    restart: always
    environment:
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: aeris_secure_password_2026
      POSTGRES_DB: aeris_sentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris -d aeris_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: aeris-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://aeris:aeris_secure_password_2026@db:5432/aeris_sentinel
      - JWT_SECRET=aeris_sentinel_super_secret_jwt_key_2026_northeast_surveillance
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: aeris-frontend
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
